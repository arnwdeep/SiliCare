<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer Blue & Teal Circular Rings -->
  <circle cx="250" cy="250" r="235" fill="#ffffff" stroke="#002d72" stroke-width="10"/>
  <path d="M 45 230 A 210 210 0 0 1 455 230" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
  <path d="M 455 270 A 210 210 0 0 1 45 270" fill="none" stroke="#002d72" stroke-width="7" stroke-linecap="round"/>

  <!-- Center S-Swoosh with Medical Cross -->
  <g transform="translate(250, 150)">
    <!-- Navy Blue Crescent (Top-Left Swoosh) -->
    <path d="M 0 -70 C -45 -70 -70 -35 -60 0 C -55 20 -35 40 0 40 C -35 25 -45 -10 -25 -45 C -10 -60 0 -70 0 -70 Z" fill="#002d72"/>
    
    <!-- Teal Crescent (Bottom-Right Swoosh) -->
    <path d="M 0 40 C 45 40 70 5 60 -30 C 55 -50 35 -70 0 -70 C 35 -55 45 -20 25 15 C 10 30 0 40 0 40 Z" fill="#0d9488"/>
    
    <!-- Medical Cross -->
    <path d="M -13 -28 H 13 V -47 H -13 Z M -28 -13 H 28 V 13 H -28 Z M -13 13 H 13 V 32 H -13 Z" fill="#009688"/>
  </g>

  <!-- Brand Typography: SILICARE -->
  <text x="250" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#002d72">
    SILICARE
  </text>

  <!-- Subtitle: — CARE YOU CAN TRUST — -->
  <g transform="translate(250, 365)">
    <line x1="-190" y1="-6" x2="-145" y2="-6" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="3" fill="#0d9488">
      CARE YOU CAN TRUST
    </text>
    <line x1="145" y1="-6" x2="190" y2="-6" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
